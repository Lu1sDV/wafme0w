name: CI

on:
  push:
    # PRs validate feature branches; avoid a second full run for each PR push.
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Immutable source SHA for release validation (empty uses triggering ref)
        required: false
        type: string

permissions:
  contents: read

# Only superseded PR runs cancel. A reusable release call has a unique run group
# and must not cancel its caller or a different release validation.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.10', '1.27.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ inputs.ref }}
          # Historical review checks need the exact PR base / pre-push commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Check fingerprint review history
        if: matrix.go == '1.27.3'
        timeout-minutes: 2
        shell: bash
        env:
          FINGERPRINT_REVIEW_EVENT: ${{ github.event_name }}
          FINGERPRINT_REVIEW_PR_BASE: ${{ github.event.pull_request.base.sha }}
          FINGERPRINT_REVIEW_PUSH_BEFORE: ${{ github.event.before }}
          FINGERPRINT_REVIEW_SOURCE_REF: ${{ inputs.ref }}
        run: |
          if [[ "$FINGERPRINT_REVIEW_EVENT" == pull_request ]]; then
            review_base="$FINGERPRINT_REVIEW_PR_BASE"
          elif [[ -n "$FINGERPRINT_REVIEW_SOURCE_REF" ]]; then
            # Reusable release validation checks the frozen candidate's change.
            review_base=$(git rev-parse --verify 'HEAD^')
          elif [[ "$FINGERPRINT_REVIEW_EVENT" == push ]]; then
            review_base="$FINGERPRINT_REVIEW_PUSH_BEFORE"
          else
            printf 'No trusted fingerprint review baseline for this event.\n' >&2
            exit 2
          fi
          python3 tools/check_fingerprint_review.py --base "$review_base"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version: ${{ matrix.go }}
      - name: Set up isolation before any tests
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap python3-venv strace time
          cat > "$RUNNER_TEMP/wafmeow-bwrap" <<'PROFILE'
          abi <abi/4.0>,
          profile wafmeow-bwrap /usr/bin/bwrap flags=(default_allow) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r "$RUNNER_TEMP/wafmeow-bwrap"
      - name: Verify formatting
        timeout-minutes: 2
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        timeout-minutes: 5
        run: go vet ./...
      - name: Check reachable dependency vulnerabilities
        if: matrix.go == '1.27.3'
        timeout-minutes: 10
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Audit optional Python dependency pins
        if: matrix.go == '1.27.3'
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/pip-audit/bin/python" -m pip_audit \
            --requirement tools/offlinebench/requirements.txt \
            --no-deps --disable-pip --strict --vulnerability-service pypi \
            --progress-spinner off --timeout 20 --format json \
            --output "$RUNNER_TEMP/optional-python-vulnerabilities.json"
      - name: Retain optional Python vulnerability report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.go == '1.27.3'
        timeout-minutes: 3
        with:
          name: optional-python-vulnerability-report
          path: ${{ runner.temp }}/optional-python-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 90
      - name: Test release helper policies
        timeout-minutes: 5
        run: python3 -m unittest discover -s tools -p '*_test.py'
      - name: Test with race detector
        timeout-minutes: 15
        run: go test -count=1 -timeout=5m -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Fuzz regexp matcher equivalence
        id: matcher-fuzz
        if: matrix.go == '1.27.3'
        timeout-minutes: 5
        run: go test ./pkg/wafmeow -run '^$' -fuzz '^FuzzMatcherRegexpEquivalence$' -fuzztime=30s -parallel=2 -timeout=3m
      - name: Retain failing matcher fuzz corpus
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.matcher-fuzz.outcome == 'failure'
        timeout-minutes: 3
        with:
          name: matcher-fuzz-failure-${{ matrix.go }}
          path: pkg/wafmeow/testdata/fuzz/FuzzMatcherRegexpEquivalence
          if-no-files-found: warn
          retention-days: 30
      - name: Install pinned httpx
        if: matrix.go == '1.27.3'
        timeout-minutes: 6
        run: |
          # Leave time for process cleanup before the runner's step timeout.
          GOBIN="$RUNNER_TEMP" timeout --kill-after=15s 5m \
            go install github.com/projectdiscovery/httpx/cmd/httpx@v1.12.0
      - name: Build candidate for httpx integration
        if: matrix.go == '1.27.3'
        timeout-minutes: 5
        run: go build -o "$RUNNER_TEMP/wafmeow-httpx" ./cmd/wafmeow
      - name: Exercise httpx producer and importer on owned loopback fixtures
        if: matrix.go == '1.27.3'
        timeout-minutes: 5
        run: python3 -u tools/httpx_smoke.py --binary "$RUNNER_TEMP/wafmeow-httpx" --httpx "$RUNNER_TEMP/httpx"
      - name: Exercise httpx usage matrix
        if: matrix.go == '1.27.3'
        timeout-minutes: 5
        run: python3 -u tools/httpx_usage_matrix.py --binary "$RUNNER_TEMP/wafmeow-httpx" --httpx "$RUNNER_TEMP/httpx" --output "$RUNNER_TEMP/httpx-usage-matrix"
      - name: Retain httpx usage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.go == '1.27.3'
        timeout-minutes: 3
        with:
          name: httpx-usage-matrix
          path: ${{ runner.temp }}/httpx-usage-matrix
          if-no-files-found: ignore
          retention-days: 7
      - name: Fuzz imported availability boundaries
        id: availability-fuzz
        if: matrix.go == '1.27.3'
        timeout-minutes: 5
        run: |
          go test ./pkg/wafmeow -run '^$' -fuzz '^FuzzAvailabilityUnusableBody$' -fuzztime=10s -parallel=2 -timeout=2m
          go test ./pkg/wafmeow -run '^$' -fuzz '^FuzzHTTPXImportCannotInventCompleteChannels$' -fuzztime=10s -parallel=2 -timeout=2m
      - name: Retain failing availability and import fuzz corpora
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.availability-fuzz.outcome == 'failure'
        timeout-minutes: 3
        with:
          name: availability-fuzz-failure-${{ matrix.go }}
          path: |
            pkg/wafmeow/testdata/fuzz/FuzzAvailabilityUnusableBody
            pkg/wafmeow/testdata/fuzz/FuzzHTTPXImportCannotInventCompleteChannels
          if-no-files-found: warn
          retention-days: 30
      - name: Export statement coverage
        timeout-minutes: 2
        run: go tool cover -func=coverage.out > "$RUNNER_TEMP/coverage-statements.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 3
        with:
          name: go-statement-coverage-${{ matrix.go }}
          path: |
            coverage.out
            ${{ runner.temp }}/coverage-statements.txt
          if-no-files-found: error
          retention-days: 30
      - name: Build
        timeout-minutes: 5
        run: go build ./cmd/wafmeow
      - name: Stress CLI option contracts without network requests
        if: matrix.go == '1.27.3'
        timeout-minutes: 5
        run: python3 tools/cli_options_smoke.py --binary "$PWD/wafmeow" --output "$RUNNER_TEMP/cli-option-contracts"
      - name: Archive CLI filename fixtures
        if: always() && matrix.go == '1.27.3'
        timeout-minutes: 2
        shell: bash
        run: |
          # Quote/colon fixture paths are valid Linux inputs but cannot be
          # uploaded as individual files by the cross-platform artifact API.
          if [[ -d "$RUNNER_TEMP/cli-option-contracts" ]]; then
            tar -czf "$RUNNER_TEMP/cli-option-contracts.tar.gz" -C "$RUNNER_TEMP/cli-option-contracts" .
          fi
      - name: Retain CLI option contract evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.go == '1.27.3'
        timeout-minutes: 3
        with:
          name: cli-option-contracts
          path: |
            ${{ runner.temp }}/cli-option-contracts.tar.gz
            ${{ runner.temp }}/cli-option-contracts/summary.json
            ${{ runner.temp }}/cli-option-contracts/results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run offline detector coverage metric
        if: matrix.go == '1.27.3'
        timeout-minutes: 15
        run: |
          /usr/bin/python3 -m venv .offlinebench-venv
          .offlinebench-venv/bin/pip install --requirement tools/offlinebench/requirements.txt
          /usr/bin/python3 -m unittest discover -s tools/offlinebench -p '*_test.py'
          python3 tools/reproduce_benchmark.py \
            --wafw00f-python "$PWD/.offlinebench-venv/bin/python" \
            --output benchmarks/benchmark-reproduction \
            --iterations 25 \
            --blocks 4
          go run ./cmd/offlinebench -verify-run benchmarks/benchmark-reproduction/run >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.go == '1.27.3'
        timeout-minutes: 3
        with:
          name: offline-semantic-coverage-and-profiles
          path: benchmarks/benchmark-reproduction
          if-no-files-found: error
          retention-days: 30
      - name: Docker build and offline behavior smoke
        if: matrix.go == '1.27.3'
        timeout-minutes: 10
        run: |
          docker build -t wafmeow:ci .
          python3 tools/smoke.py docker wafmeow:ci

  browser:
    name: Local Chromium integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WAFME0W_TEST_BROWSER: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version: '1.26.10'
      - name: Set up Linux isolation
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          cat > "$RUNNER_TEMP/wafmeow-bwrap" <<'PROFILE'
          abi <abi/4.0>,
          profile wafmeow-bwrap /usr/bin/bwrap flags=(default_allow) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r "$RUNNER_TEMP/wafmeow-bwrap"
      - name: Require installed native Chromium
        timeout-minutes: 2
        run: |
          test -x "$WAFME0W_TEST_BROWSER"
          "$WAFME0W_TEST_BROWSER" --version
      - name: Exercise owned browser fixtures
        timeout-minutes: 5
        run: go test -race -tags browser_integration ./pkg/wafmeow -run '^TestBrowser' -count=1 -timeout=3m

  native:
    name: Native PR test and archive smoke (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64, suffix: '', extension: tar.gz}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, suffix: '', extension: tar.gz}
          - {runner: macos-15, os: darwin, arch: arm64, suffix: '', extension: tar.gz}
          - {runner: macos-15-intel, os: darwin, arch: amd64, suffix: '', extension: tar.gz}
          - {runner: windows-2022, os: windows, arch: amd64, suffix: .exe, extension: zip}
    env:
      CGO_ENABLED: '0'
      BINARY_SUFFIX: ${{ matrix.suffix }}
      RELEASE_OS: ${{ matrix.os }}
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        timeout-minutes: 5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        timeout-minutes: 5
        with:
          python-version: '3.12'
      - name: Set up Linux isolation before tests
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap python3-venv
          cat > "$RUNNER_TEMP/wafmeow-bwrap" <<'PROFILE'
          abi <abi/4.0>,
          profile wafmeow-bwrap /usr/bin/bwrap flags=(default_allow) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r "$RUNNER_TEMP/wafmeow-bwrap"
      - name: Native tests
        timeout-minutes: 10
        run: go test -count=1 -timeout=5m ./...
      - name: Build and package native binary
        shell: bash
        timeout-minutes: 5
        run: |
          CHECK_TAG=$(python tools/release.py ci-tag)
          printf 'CHECK_TAG=%s\n' "$CHECK_TAG" >> "$GITHUB_ENV"
          go build -trimpath -buildvcs=true -o "$RUNNER_TEMP/wafmeow$BINARY_SUFFIX" ./cmd/wafmeow
          python tools/release.py package --tag "$CHECK_TAG" --revision "$(git rev-parse HEAD)" \
            --os "$RELEASE_OS" --arch "$RELEASE_ARCH" --binary "$RUNNER_TEMP/wafmeow$BINARY_SUFFIX"
      - name: Smoke extracted archive outside checkout
        shell: bash
        timeout-minutes: 5
        run: python tools/smoke.py archive "dist/wafmeow_${CHECK_TAG}_${RELEASE_OS}_${RELEASE_ARCH}.${RELEASE_EXTENSION}"
      - name: Native release-container build and hardened offline smoke
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: |
          python tools/container_release.py build --tag "$CHECK_TAG" --revision "$(git rev-parse HEAD)" \
            --arch "$RELEASE_ARCH" --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/native-container"
