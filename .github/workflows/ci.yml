name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Verify formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Export statement coverage
        run: go tool cover -func=coverage.out > coverage-statements.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: go-statement-coverage-${{ matrix.go }}
          path: |
            coverage.out
            coverage-statements.txt
          if-no-files-found: error
          retention-days: 30
      - name: Build
        run: go build ./cmd/wafme0w
      - name: Set up isolated benchmark runtime
        if: matrix.go == '1.27.x'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap python3-venv
          # Allow namespaces for the sandbox helper, not every unprivileged process.
          cat > "$RUNNER_TEMP/wafme0w-bwrap" <<'PROFILE'
          abi <abi/4.0>,
          profile wafme0w-bwrap /usr/bin/bwrap flags=(default_allow) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r "$RUNNER_TEMP/wafme0w-bwrap"
      - name: Run offline detector coverage metric
        if: matrix.go == '1.27.x'
        run: |
          /usr/bin/python3 -m venv .offlinebench-venv
          .offlinebench-venv/bin/pip install --requirement tools/offlinebench/requirements.txt
          /usr/bin/python3 -m unittest discover -s tools/offlinebench -p '*_test.py'
          go run ./cmd/offlinebench \
            -wafw00f-python "$PWD/.offlinebench-venv/bin/python" \
            -output offlinebench-results \
            -iterations 25 \
            -blocks 4 \
            -min-coverage 1 \
            -min-accuracy 1
          go run ./cmd/offlinebench -verify-run offlinebench-results >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always() && matrix.go == '1.27.x'
        with:
          name: offline-semantic-coverage-and-profiles
          path: offlinebench-results
          if-no-files-found: error
          retention-days: 30
      - name: Docker build and help smoke test
        if: matrix.go == '1.27.x'
        run: |
          docker build -t wafme0w:ci .
          docker run --rm --network none wafme0w:ci --help

  browser:
    name: Local Chromium integration
    runs-on: ubuntu-24.04
    env:
      WAFME0W_TEST_BROWSER: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Require installed native Chromium
        run: |
          test -x "$WAFME0W_TEST_BROWSER"
          "$WAFME0W_TEST_BROWSER" --version
      - name: Exercise owned browser fixtures
        run: go test -race -tags browser_integration ./pkg/wafme0w -run '^TestBrowser' -count=1 -timeout=3m
