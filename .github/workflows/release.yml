name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Next stable release (leave patch for fixes; ignored with an existing tag)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      tag:
        description: Optional existing tag for recovery or prereleases; leave empty for a new release
        required: false
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GH_REPO: ${{ github.repository }}

concurrency:
  # Keep version allocation, registry delivery and tap updates in one queue.
  group: release-delivery-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Check delivery access, choose version and freeze source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      revision: ${{ steps.prepare.outputs.revision }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate release request
        id: request
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import release
          tag = os.environ['RELEASE_TAG']
          if not tag:
              release.require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and
                              os.environ['GITHUB_REF'] == 'refs/heads/main',
                              'Start a new release with Run workflow on main')
          stable = not tag or release.version_key(tag)[3]
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'stable={str(stable).lower()}\n')
          PY
      - name: Check stable delivery configuration before creating a tag
        if: steps.request.outputs.stable == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NEW_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
          PUBLISH_GHCR: ${{ vars.WAFME0W_PUBLISH_GHCR }}
        run: |
          if [[ "$NEW_RELEASE" == true && "$PUBLISH_GHCR" != true ]]; then
            echo 'Set the repository variable WAFME0W_PUBLISH_GHCR=true before starting full delivery.' >&2
            exit 1
          fi
          python tools/homebrew_release.py --check-access --tap Lu1sDV/homebrew-tap
      - name: Create the next version or resolve the supplied immutable tag
        id: prepare
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python tools/release.py prepare --tag "$RELEASE_TAG"
          else
            # Continue this run: GITHUB_TOKEN-created tags do not start a second workflow.
            python tools/release_start.py --bump "$RELEASE_BUMP" --revision "$GITHUB_SHA"
          fi
      - name: Record the selected release
        env:
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          RELEASE_SHA: ${{ steps.prepare.outputs.revision }}
        run: |
          printf '## Release %s\n\nSource: `%s`\n\nDelivery continues after all validation gates pass.\n' \
            "$RELEASE_TAG" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: Required complete CI on frozen source
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}

  native:
    name: Test and package ${{ matrix.os }}/${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64, suffix: '', extension: tar.gz}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, suffix: '', extension: tar.gz}
          - {runner: macos-15, os: darwin, arch: arm64, suffix: '', extension: tar.gz}
          - {runner: macos-15-intel, os: darwin, arch: amd64, suffix: '', extension: tar.gz}
          - {runner: windows-2022, os: windows, arch: amd64, suffix: .exe, extension: zip}
    env:
      CGO_ENABLED: '0'
      BINARY_SUFFIX: ${{ matrix.suffix }}
      RELEASE_OS: ${{ matrix.os }}
      RELEASE_ARCH: ${{ matrix.arch }}
      RELEASE_EXTENSION: ${{ matrix.extension }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up Linux isolation before tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap python3-venv
          cat > "$RUNNER_TEMP/wafme0w-bwrap" <<'PROFILE'
          abi <abi/4.0>,
          profile wafme0w-bwrap /usr/bin/bwrap flags=(default_allow) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r "$RUNNER_TEMP/wafme0w-bwrap"
      - name: Run native package tests
        timeout-minutes: 10
        run: go test -timeout=5m ./...
      - name: Build native CLI with VCS identity
        shell: bash
        timeout-minutes: 5
        run: go build -trimpath -buildvcs=true -o "$RUNNER_TEMP/wafme0w$BINARY_SUFFIX" ./cmd/wafme0w
      - name: Verify binary identity and archive release files
        shell: bash
        run: |
          python tools/release.py package --tag "$RELEASE_TAG" --revision "$RELEASE_SHA" \
            --os "$RELEASE_OS" --arch "$RELEASE_ARCH" --binary "$RUNNER_TEMP/wafme0w$BINARY_SUFFIX"
      - name: Smoke the extracted native archive outside checkout
        shell: bash
        timeout-minutes: 5
        run: python tools/smoke.py archive "dist/wafme0w_${RELEASE_TAG}_${RELEASE_OS}_${RELEASE_ARCH}.${RELEASE_EXTENSION}"
      - name: Build and smoke the native release container without pushing
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: |
          python tools/container_release.py build --tag "$RELEASE_TAG" --revision "$RELEASE_SHA" \
            --arch "$RELEASE_ARCH" --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/native-container"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: release-image-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-container/*
          if-no-files-found: error
          compression-level: 0
          overwrite: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-raw-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          overwrite: false

  verify:
    name: Verify downloaded identities, hashes and actual packaged binaries
    needs: [prepare, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-raw-*
          path: dist
          merge-multiple: true
      - name: Install pinned binary scanner
        timeout-minutes: 5
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan all extracted binaries and generate verified manifest
        timeout-minutes: 30
        run: python tools/release.py verify --tag "$RELEASE_TAG" --revision "$RELEASE_SHA"
      - name: Retain scanner reports even on findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binary-vulnerability-reports
          path: security-reports
          if-no-files-found: error
          retention-days: 90
      - name: Attest exact source manifest and verified assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
          # A custom predicate records the actual prepared source even when a
          # dispatch builds a tag different from the workflow's triggering ref.
          predicate-type: https://github.com/${{ github.repository }}/release-manifest/v1
          predicate-path: dist/manifest.json
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verified
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          overwrite: false

  publish:
    name: Publish verified assets without overwrite
    # Also coordinate with releases still running an older workflow revision.
    concurrency:
      group: release-publication-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    needs: [prepare, ci, native, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-verified
          path: dist
      - name: Recheck hashes and remote tag, stage draft, recheck then publish
        run: python tools/release.py publish --tag "$RELEASE_TAG" --revision "$RELEASE_SHA"

  publish-container:
    name: Publish tested native images to GHCR
    # Explicit repository opt-in after GHCR visibility/access is configured.
    # No image is pushed by PR CI or before archive publication succeeds.
    if: vars.WAFME0W_PUBLISH_GHCR == 'true'
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-verified
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-image-linux-*
          path: container-images
          merge-multiple: true
      - name: Authenticate only the publication job
        run: |
          # actions/attest reads $HOME/.docker/config.json and ignores
          # DOCKER_CONFIG, so the registry attestation needs the default
          # credential file; the logout step below removes it again.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Verify loaded binaries and publish versioned multi-platform image
        id: container
        run: |
          python tools/container_release.py publish --tag "$RELEASE_TAG" --revision "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" --images container-images \
            --output "$RUNNER_TEMP/container-manifest.json"
      - name: Attest the immutable registry digest and actual frozen source
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.container.outputs.image }}
          subject-digest: ${{ steps.container.outputs.digest }}
          predicate-type: https://github.com/${{ github.repository }}/release-container/v1
          predicate-path: ${{ runner.temp }}/container-manifest.json
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: published-container-identity
          path: ${{ runner.temp }}/container-manifest.json
          if-no-files-found: warn
          retention-days: 90
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io

  publish-homebrew:
    name: Audit, test and update the Homebrew tap
    needs: [prepare, publish, publish-container]
    # An explicitly disabled registry channel must not suppress a stable tap
    # update; a failed registry delivery must. Prereleases never replace stable.
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.prerelease == 'false' &&
          needs.publish.result == 'success' &&
          (needs.publish-container.result == 'success' || needs.publish-container.result == 'skipped') }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-verified
          path: dist
      - name: Verify the published formula before running Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/homebrew_release.py --verify-only --tag "$RELEASE_TAG" \
            --revision "$RELEASE_SHA" --dist dist
      - name: Audit and test the candidate formula against published archives
        run: |
          brew tap Lu1sDV/tap https://github.com/Lu1sDV/homebrew-tap.git
          cp dist/wafme0w.rb "$(brew --repository Lu1sDV/tap)/Formula/wafme0w.rb"
          brew audit --strict --online Lu1sDV/tap/wafme0w
          brew install --formula Lu1sDV/tap/wafme0w
          brew test Lu1sDV/tap/wafme0w
      - name: Commit the verified formula to the tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          python tools/homebrew_release.py --tag "$RELEASE_TAG" --revision "$RELEASE_SHA" \
            --tap Lu1sDV/homebrew-tap --dist dist
      - name: Record completed stable delivery
        run: |
          printf '## Delivery complete: %s\n\n[GitHub release](https://github.com/%s/releases/tag/%s)\n\nHomebrew: `brew install Lu1sDV/tap/wafme0w`\n' \
            "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
